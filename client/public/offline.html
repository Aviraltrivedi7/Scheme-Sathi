    <main class="card"><span class="mark">SS</span><h1>You’re offline</h1><p>Scheme Sathi needs a connection to refresh scheme information. Your saved app shell is ready—please reconnect and try again.</p><button type="button" onclick="location.reload()">Try again</button></main>
